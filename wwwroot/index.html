<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MooSharp</title>
    <base href="/" />
    
    <!-- Core Styles -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link href="css/ModernCSS/main.css" rel="stylesheet" />
    <link href="css/TerminalCSS/terminal.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="images/MooSharpWhiteCircle.png" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Core Scripts -->
    <script src="scripts/keyListener.js" defer></script>
    <script src="scripts/matrixText.js" defer></script>
    <script src="scripts/navScroll.js" defer></script>
    <script src="scripts/terminalTyping.js" defer></script>
    <script src="scripts/indexOuterUI.js" defer></script>
    <script src="scripts/drag.js" defer></script>
    <script src="scripts/hologramLab.js" defer></script>
    <script src="scripts/snake.js" defer></script>

</head>

<body id="bodyRoot">
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

<!-- Theme Handling -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (window.location.pathname.startsWith("/terminal")) {
            document.getElementById("bodyRoot")?.classList.add("terminal-root");
        }
    });

// Quick Click Game
    
    function playClickSound() {
        const audio = new Audio('/sounds/qcpop.mp3');
        audio.volume = 0.4;
        audio.play();
    }

    function animateHit() {
        const target = document.querySelector('.qc-target');
        if (target) {
            target.classList.add('hit');
            setTimeout(() => {
                target.classList.remove('hit');
            }, 200);
        }
    }
</script>
</html>
