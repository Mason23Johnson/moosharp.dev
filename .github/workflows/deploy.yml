# PAGES_ACTIONS_BLAZOR
name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # CTRL+F: PUBLISH_STEP
      - name: Publish
        run: dotnet publish ./moosharp.dev.csproj -c Release -o publish

      # CTRL+F: PREPARE_SITE
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp -r publish/wwwroot/* _site/
          # Prevent PWA cache from breaking SRI
          rm -f _site/service-worker*.js _site/manifest.webmanifest _site/service-worker-assets.js
          # SPA routing + Pages
          cp _site/index.html _site/404.html
          : > _site/.nojekyll
          echo "moosharp.dev" > _site/CNAME


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
